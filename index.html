const $=s=>document.querySelector(s);
const ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
let S={done:{},days:[],focus:{},best:0,notes:{},lang:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('sabaq')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sabaq',JSON.stringify(S))}catch(e){}};
const ds=d=>d.toLocaleDateString('en-CA'),today=()=>ds(new Date());
const mark=()=>{if(!S.days.includes(today()))S.days.push(today());save()};
function streak(){let n=0,d=new Date();if(!S.days.includes(ds(d)))d.setDate(d.getDate()-1);while(S.days.includes(ds(d))){n++;d.setDate(d.getDate()-1)}return n}
const prog=i=>SUB[i].ch.filter((_,j)=>S.done[i+'-'+j]).length;
let V={tab:'home',sub:null,ch:null,pm:'quiz'};
let Q={i:0,sel:null,s:0,end:false},F={i:0,f:false,r:{x:0,v:0,m:0},end:false};
let T={mode:'f',len:1500,left:1500,run:false,end:0,id:0,fin:false};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

const HUE=[['#D8CBF6','#8B7CFF'],['#F6E3A0','#FFC145'],['#BDE9D1','#34D399'],['#FFD1A6','#FF8A3D'],['#F6C5D5','#FF5C8A'],['#C3DCF6','#4DA3FF'],['#E2C9F2','#C26BFF'],['#D6EBA5','#84CC16']];
const hv=i=>'--p:'+HUE[i][0]+';--g:'+HUE[i][1];
const D={};
[['Good morning','ਸ਼ੁਭ ਸਵੇਰ','सुप्रभात'],['Good afternoon','ਸ਼ੁਭ ਦੁਪਹਿਰ','शुभ दोपहर'],['Good evening','ਸ਼ੁਭ ਸ਼ਾਮ','शुभ संध्या'],['Good night','ਸ਼ੁਭ ਰਾਤਰੀ','शुभ रात्रि'],['This week','ਇਸ ਹਫ਼ਤੇ','इस सप्ताह'],['Home','ਘਰ','होम'],['Learn','ਪੜ੍ਹੋ','पढ़ाई'],['Practice','ਅਭਿਆਸ','अभ्यास'],['Focus','ਫੋਕਸ','फ़ोकस'],['Let’s study','ਚੱਲੋ ਪੜ੍ਹੀਏ','चलो पढ़ें'],['Subjects','ਵਿਸ਼ੇ','विषय'],['Streak','ਲਗਾਤਾਰ ਦਿਨ','लगातार दिन'],['Focus today','ਅੱਜ ਦਾ ਫੋਕਸ','आज का फ़ोकस'],['days','ਦਿਨ','दिन'],['Continue with','ਜਾਰੀ ਰੱਖੋ:','जारी रखें:'],['Open chapter','ਅਧਿਆਇ ਖੋਲ੍ਹੋ','अध्याय खोलें'],['Mark as read','ਪੜ੍ਹਿਆ ਮੰਨੋ','पढ़ा हुआ चिह्नित करें'],['Marked as read','ਪੜ੍ਹ ਲਿਆ','पढ़ लिया'],['Read','ਪੜ੍ਹਿਆ','पढ़ा'],['Not read yet','ਅਜੇ ਨਹੀਂ ਪੜ੍ਹਿਆ','अभी नहीं पढ़ा'],['Quiz','ਕੁਇਜ਼','क्विज़'],['Flashcards','ਫਲੈਸ਼ਕਾਰਡ','फ़्लैशकार्ड'],['Start','ਸ਼ੁਰੂ','शुरू'],['Pause','ਰੋਕੋ','रोकें'],['Reset','ਰੀਸੈੱਟ','रीसेट'],['Next question','ਅਗਲਾ ਸਵਾਲ','अगला प्रश्न'],['See result','ਨਤੀਜਾ ਵੇਖੋ','परिणाम देखें'],['Try again','ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ','फिर कोशिश करें'],['Correct','ਸਹੀ','सही'],['Not quite','ਪੂਰਾ ਸਹੀ ਨਹੀਂ','पूरा सही नहीं'],['Missed','ਗਲਤ','ग़लत'],['Review','ਦੁਹਰਾਓ','दोहराएँ'],['Mastered','ਯਾਦ ਹੋ ਗਿਆ','याद हो गया'],['Tap to reveal','ਜਵਾਬ ਵੇਖਣ ਲਈ ਛੂਹੋ','उत्तर देखने के लिए छुएँ'],['Ready','ਤਿਆਰ','तैयार'],['Session complete','ਸੈਸ਼ਨ ਪੂਰਾ','सत्र पूरा'],['Official resources','ਸਰਕਾਰੀ ਸਰੋਤ','आधिकारिक संसाधन']].forEach(a=>D[a[0]]=[a[1],a[2]]);
let LI=S.lang||0;
if(S.theme)document.documentElement.dataset.theme=S.theme;
const isDk=()=>(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';
function sky(){const h=new Date().getHours(),P=h<5||h>=20?['#27407F','#6A5BD0','#C9D2FF','#8E83FF','Good night']:h<11?['#FFD9A0','#FF9E7A','#FFF3C4','#FFB347','Good morning']:h<16?['#BDE3FF','#7CC4FF','#FFF1A8','#FFC21A','Good afternoon']:['#FFB27A','#E4678F','#FFD9A0','#FF7A59','Good evening'],r=document.documentElement.style;r.setProperty('--sky1',P[0]);r.setProperty('--sky2',P[1]);r.setProperty('--o1',P[2]);r.setProperty('--o2',P[3]);return P[4]}
const t=k=>LI&&D[k]?D[k][LI-1]:k;
const tr=h=>LI?h.replace(/>([^<>]+)</g,(m,s)=>D[s.trim()]?'>'+D[s.trim()][LI-1]+'<':m):h;
const nm=s=>s.n[LI];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const lk=x=>`<a class="card row lnk" href="${x[1]}" target="_blank" rel="noopener"><span class="grow">${x[0]}</span>${ic('right')}</a>`;
function subCard(i){const s=SUB[i],p=prog(i),n=s.ch.length;return `<button class="card gl book" style="${hv(i)}" data-a="sub" data-v="${i}"><h2>${nm(s)}</h2><span class="ar">${ic('arrow')}</span><span class="lb">${n?p+' / '+n:'Resources'}</span><div class="bar"><i style="width:${n?p/n*100:0}%"></i></div></button>`}
function home(){
 const min=S.focus[today()]||0,sk=sky();let nx=null,tot=0,mx=30;const arr=[];
 SUB.forEach((s,i)=>s.ch.forEach((c,j)=>{if(!nx&&!S.done[i+'-'+j])nx=[i,j]}));
 for(let k=6;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);const m=S.focus[ds(d)]||0;arr.push([m,d.toLocaleDateString('en',{weekday:'narrow'}),k===0]);tot+=m;mx=Math.max(mx,m)}
 const cols=arr.map(a=>`<div class="col ${a[2]?'td':''}"><div class="pill"><i style="height:${a[0]/mx*100}%"></i>${a[2]?`<span class="tip" style="bottom:calc(${a[0]/mx*100}% + 8px)">${a[0]}m</span>`:''}</div><b>${a[1]}</b></div>`).join('');
 return `<div class="top"><div class="lang">${['English','ਪੰਜਾਬੀ','हिन्दी'].map((l,k)=>`<button aria-pressed="${LI===k}" data-a="lang" data-v="${k}">${l}</button>`).join('')}</div><button class="ib" data-a="theme" aria-label="Switch theme">${ic(isDk()?'sun':'moon')}</button></div>
 <div class="hd"><div><p class="lb">${sk}</p><h1>Let’s study</h1></div><span class="chip" aria-label="Streak">${ic('flame')}${streak()}</span></div><div class="stack">
 ${nx?`<button class="card gl hero" style="${hv(nx[0])}" data-a="ch" data-v="${nx[0]}-${nx[1]}"><span class="lb">${t('Continue with')} ${nm(SUB[nx[0]])}</span><h2>${SUB[nx[0]].ch[nx[1]]}</h2><span class="go">Open chapter ${ic('arrow')}</span></button>`:''}
 <div class="card"><div class="rowb"><h2>This week</h2><b class="tn">${tot} min</b></div><div class="chart">${cols}</div><div class="rowb" style="margin-top:16px"><span class="lb">Focus today</span><b class="tn">${min} / 30 min</b></div><div class="bar"><i style="width:${Math.min(100,min/30*100)}%;background:var(--mg)"></i></div></div></div>
 <h2 class="sec">Subjects</h2><div class="grid g2">${SUB.map((_,i)=>subCard(i)).join('')}</div>`}
function learn(){
 if(V.sub==null)return `<h1>Learn</h1><div class="grid g2">${SUB.map((_,i)=>subCard(i)).join('')}</div>`;
 const s=SUB[V.sub],R=[].concat(s.pdf?[['Textbook PDF, 2021-22 edition',s.pdf[LI]||s.pdf[0]]]:[],[SYL,BK,EDU]).map(lk).join('');
 if(V.ch==null)return `<button class="back" data-a="back">${ic('left')}Subjects</button><div class="card gl ban" style="${hv(V.sub)}"><span class="lb">${s.ch.length?prog(V.sub)+' / '+s.ch.length:'Resources'}</span><h1>${nm(s)}</h1></div>`
 +(s.ch.length?`<div class="grid" style="${hv(V.sub)}">${s.ch.map((c,j)=>{const d=S.done[V.sub+'-'+j];return `<button class="card row" data-a="ch" data-v="${V.sub}-${j}"><span class="num">${j+1}</span><span class="grow"><h2>${c}</h2><span class="lb">${d?'Read':'Not read yet'}</span></span>${d?ic('check').replace('class="ic"','class="ic ok"'):ic('right')}</button>`}).join('')}</div><p class="lb" style="margin-top:12px">Chapters follow the PSEB textbook. The board can trim chapters each year, so check the official syllabus.</p>`:`<p class="lb">The chapter list for this subject is in the official syllabus. Open it below.</p>`)
 +`<h2 class="sec">Official resources</h2><div class="grid">${R}</div>`;
 const k=V.sub+'-'+V.ch,d=S.done[k];
 return `<button class="back" data-a="back">${ic('left')}${nm(s)}</button><h1>${s.ch[V.ch]}</h1><textarea id="nt" rows="7" placeholder="Write your own notes for this chapter">${esc(S.notes[k]||'')}</textarea><button class="btn ${d?'ghost':''}" data-a="done" data-v="${k}">${d?ic('check')+'Marked as read':'Mark as read'}</button><h2 class="sec">Official resources</h2><div class="grid">${R}</div>`}
function quiz(){
 if(Q.end)return `<div class="card center"><span class="lb">Your score</span><div class="big">${Q.s}<span>/${QZ.length}</span></div><p>${Q.s>=6?'Strong work. Keep your streak going.':'Good start. Read the chapters again, then retry.'}</p><p class="lb">Best score: ${S.best} of ${QZ.length}</p></div><button class="btn" data-a="qreset">Try again</button>`;
 const q=QZ[Q.i],a=Q.sel!=null;
 return `<p class="lb">Question ${Q.i+1} of ${QZ.length}</p><div class="bar" style="margin-top:8px"><i style="width:${Q.i/QZ.length*100}%"></i></div><p class="qt">${q.q}</p>`
 +q.o.map((o,k)=>{let c='',x='';if(a){if(k===q.a){c='ok';x=ic('check')}else if(k===Q.sel){c='bad';x=ic('x')}}return `<button class="opt ${c}" data-a="ans" data-v="${k}" ${a?'disabled':''}><span>${o}</span>${x}</button>`}).join('')
 +(a?`<div class="card fb"><b class="${Q.sel===q.a?'okt':'badt'}">${Q.sel===q.a?'Correct':'Not quite'}</b><p>${q.e}</p></div><button class="btn" data-a="next">${Q.i+1<QZ.length?'Next question':'See result'}</button>`:'')}
function cards(){
 if(F.end)return `<div class="card center"><span class="lb">Deck finished</span><div class="big">${F.r.m}<span> mastered</span></div><p class="lb">${F.r.v} to review, ${F.r.x} missed</p></div><button class="btn" data-a="freset">Study again</button>`;
 const c=FC[F.i];
 return `<p class="lb">Card ${F.i+1} of ${FC.length}</p><div class="bar" style="margin:8px 0 16px"><i style="width:${F.i/FC.length*100}%"></i></div>
 <button class="card gl fc" style="--p:#F7E3A1;--g:#FFB020" data-a="flip" ${F.f?'disabled':''} aria-label="Reveal answer"><span class="lb">${F.f?'Answer':c[0]===c[0]?'Prompt':''}</span><span class="ft">${F.f?c[1]:c[0]}</span><span class="lb">${F.f?'':'Tap to reveal'}</span></button>
 ${F.f?`<div class="grid g3"><button class="btn rt x" data-a="rate" data-v="x">${ic('x')}Missed</button><button class="btn rt v" data-a="rate" data-v="v">${ic('redo')}Review</button><button class="btn rt m" data-a="rate" data-v="m">${ic('check')}Mastered</button></div>`:''}`}
function practice(){return `<h1>Practice</h1><div class="seg">${[['quiz','Quiz'],['cards','Flashcards']].map(([k,l])=>`<button aria-pressed="${V.pm===k}" data-a="pm" data-v="${k}">${l}</button>`).join('')}</div>`+(V.pm==='quiz'?quiz():cards())}
function focus(){return `<h1>Focus</h1><div class="seg">${[['f','Focus 25'],['b','Break 5']].map(([k,l])=>`<button aria-pressed="${T.mode===k}" data-a="mode" data-v="${k}">${l}</button>`).join('')}</div>
 <div class="ringw"><svg viewBox="0 0 200 200" class="ring" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="88"/><circle id="rg" class="prg" cx="100" cy="100" r="88" style="stroke-dashoffset:${553*(1-T.left/T.len)}"/></svg><div class="tm"><b id="tm">${fmt(T.left)}</b><span class="lb">${T.fin?'Session complete':T.run?(T.mode==='f'?'Stay with it':'Rest your eyes'):'Ready'}</span></div></div>
 <div class="grid g2"><button class="btn" style="margin:0" data-a="run">${T.run?'Pause':'Start'}</button><button class="btn ghost" style="margin:0" data-a="rst">Reset</button></div>
 <p class="lb c">Today: ${S.focus[today()]||0} min focused</p>`}

function render(){
 $('#m').innerHTML=tr(({home,learn,practice,focus})[V.tab]());
 document.querySelectorAll('nav span').forEach(e=>e.textContent=t(e.dataset.k));
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===V.tab));
}
function go(p){Object.assign(V,p);render();window.scrollTo(0,0)}
function paint(){const e=$('#tm');if(!e)return;e.textContent=fmt(T.left);$('#rg').style.strokeDashoffset=553*(1-T.left/T.len)}
function pause(){clearInterval(T.id);T.run=false}
function tick(){
 T.left=Math.max(0,Math.round((T.end-Date.now())/1000));
 if(T.left<=0){pause();T.fin=true;if(T.mode==='f'){S.focus[today()]=(S.focus[today()]||0)+25;mark()}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}if(V.tab==='focus')render()}else paint()}
function addPartial(){if(T.mode==='f'&&!T.fin){const m=Math.floor((T.len-T.left)/60);if(m>0){S.focus[today()]=(S.focus[today()]||0)+m;mark()}}}
const act={
 lang:v=>{LI=+v;S.lang=LI;save();render()},
 theme:()=>{S.theme=isDk()?'light':'dark';document.documentElement.dataset.theme=S.theme;save();render()},
 tab:v=>go({tab:v,sub:null,ch:null}),
 sub:v=>go({tab:'learn',sub:+v,ch:null}),
 ch:v=>{const[s,c]=v.split('-');go({tab:'learn',sub:+s,ch:+c})},
 back:()=>V.ch!=null?go({ch:null}):go({sub:null}),
 done:v=>{S.done[v]=!S.done[v];if(S.done[v])mark();save();render()},
 pm:v=>{V.pm=v;render()},
 ans:v=>{if(Q.sel!=null)return;Q.sel=+v;if(+v===QZ[Q.i].a)Q.s++;render()},
 next:()=>{if(Q.i+1<QZ.length){Q.i++;Q.sel=null}else{Q.end=true;S.best=Math.max(S.best,Q.s);mark()}render();window.scrollTo(0,0)},
 qreset:()=>{Q={i:0,sel:null,s:0,end:false};render()},
 flip:()=>{F.f=true;render()},
 rate:v=>{F.r[v]++;if(F.i+1<FC.length){F.i++;F.f=false}else{F.end=true;mark()}render()},
 freset:()=>{F={i:0,f:false,r:{x:0,v:0,m:0},end:false};render()},
 mode:v=>{pause();addPartial();T.mode=v;T.len=T.left=v==='f'?1500:300;T.fin=false;render()},
 run:()=>{if(T.run){pause()}else{if(T.fin||T.left<=0){T.left=T.len;T.fin=false}T.end=Date.now()+T.left*1000;T.run=true;T.id=setInterval(tick,250)}render()},
 rst:()=>{pause();addPartial();T.left=T.len;T.fin=false;render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='nt'&&V.ch!=null){S.notes[V.sub+'-'+V.ch]=e.target.value;save()}});
render();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
